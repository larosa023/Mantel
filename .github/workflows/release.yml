name: Release

# Three ways to ship, all end up in the same place:
#   1. Bump <Version> in src/Mantel/Mantel.csproj and push to main (e.g. 0.1.1, or 0.2.0-beta.1)
#   2. Push a tag:  git tag v0.1.1 && git push origin v0.1.1
#   3. Create a release on GitHub (which creates the tag)
# A version with a suffix (0.2.0-beta.1) goes to the beta channel as a prerelease.
on:
  push:
    branches: [main]
    paths: ['src/Mantel/Mantel.csproj']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # the built-in GITHUB_TOKEN creates the tag and release; no secrets to set up

concurrency:
  group: release
  cancel-in-progress: false

env:
  VPK_VERSION: 0.0.1298   # keep in step with the Velopack package in Mantel.csproj

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need existing tags to tell whether this version already shipped

      - name: Work out version and channel
        id: v
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          } else {
            [xml]$proj = Get-Content src/Mantel/Mantel.csproj
            $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version.Trim()
          }
          $tag = "v$version"
          $isBeta = $version.Contains('-')

          # On a push to main, skip if this version already has a release (the csproj changed for another reason).
          $skip = $false
          if ("${{ github.ref_type }}" -ne "tag") {
            gh release view $tag --repo ${{ github.repository }} *> $null
            if ($LASTEXITCODE -eq 0) {
              $assets = gh release view $tag --repo ${{ github.repository }} --json assets --jq '.assets | length'
              if ([int]$assets -gt 0) { $skip = $true }
            }
          }
          $global:LASTEXITCODE = 0

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "channel=$(if ($isBeta) { 'beta' } else { 'win' })" >> $env:GITHUB_OUTPUT
          "pre=$(if ($isBeta) { '--pre' } else { '' })" >> $env:GITHUB_OUTPUT
          "skip=$($skip.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version on channel $(if ($isBeta) { 'beta' } else { 'win' }); skip=$skip"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag
        if: steps.v.outputs.skip == 'false' && github.ref_type != 'tag'
        shell: pwsh
        run: |
          git tag --list ${{ steps.v.outputs.tag }} | Out-String | Set-Variable existing
          if (-not $existing.Trim()) {
            git tag ${{ steps.v.outputs.tag }}
            git push origin ${{ steps.v.outputs.tag }}
          }

      - uses: actions/setup-dotnet@v4
        if: steps.v.outputs.skip == 'false'
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Publish app
        if: steps.v.outputs.skip == 'false'
        run: >
          dotnet publish src/Mantel/Mantel.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.v.outputs.version }} -o publish

      - name: Install vpk
        if: steps.v.outputs.skip == 'false'
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # Pulls the previous release so vpk can build a small delta package against it.
      # Fails harmlessly on the very first release of a channel.
      - name: Download previous release
        if: steps.v.outputs.skip == 'false'
        continue-on-error: true
        run: >
          vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --channel ${{ steps.v.outputs.channel }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack
        if: steps.v.outputs.skip == 'false'
        run: >
          vpk pack --packId Mantel --packVersion ${{ steps.v.outputs.version }}
          --packDir publish --mainExe Mantel.exe --packTitle Mantel
          --icon src/Mantel/Assets/mantel.ico --channel ${{ steps.v.outputs.channel }}

      # --merge: works whether the release was made here or by hand on GitHub first.
      - name: Upload to GitHub Releases
        if: steps.v.outputs.skip == 'false'
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --publish --merge --releaseName "Mantel ${{ steps.v.outputs.version }}"
          --tag ${{ steps.v.outputs.tag }} --channel ${{ steps.v.outputs.channel }}
          --token ${{ secrets.GITHUB_TOKEN }} ${{ steps.v.outputs.pre }}
